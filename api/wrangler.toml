name = "rice-pos-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# One Worker serves POS (pos.) and owner app (owner., behind Cloudflare Access).
# No workers.dev / preview URLs: every way in goes through our own hostnames.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "pos.twostackmaxgame.win", custom_domain = true },
  { pattern = "owner.twostackmaxgame.win", custom_domain = true },
]

[build]
command = "worker-build --release"

# ---------------------------------------------------------------------------
# D1 — all POS data (schema v1, see migrations/)
# Remote DB created 2026-10-29 (APAC). Local dev uses .wrangler/state.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "rice-pos"
database_id = "eb902c69-455f-4c6d-bfdf-3eb8ef48618d"
migrations_dir = "migrations"

# R2 — menu images (WebP) now; daily backups/archives later (M5)
# App-enforced free-tier quotas: see api/src/media.rs (R2 has no spending cap).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rice-pos-media"

# Cloudflare Access (owner auth) — filled in a later ticket (M0).
# ACCESS_TEAM_DOMAIN: Zero Trust team domain (JWKS + iss), e.g. "<team>.cloudflareaccess.com"
# ACCESS_AUD:         Access application AUD claim
[vars]
ACCESS_TEAM_DOMAIN = "vbo.cloudflareaccess.com"
ACCESS_AUD = "85f5affb5b3c7bb44173c89f678199e7f5c24b935a34fd91b18d085172b69932"

# SPA (web/dist) + API in one Worker. Only /api/* runs the Worker first; every
# other path is a static asset, unknown paths fall back to index.html.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
