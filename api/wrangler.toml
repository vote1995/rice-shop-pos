name = "rice-pos-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# One Worker serves POS (pos.) and owner app (owner., behind Cloudflare Access).
# No workers.dev / preview URLs: every way in goes through our own hostnames.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "pos.twostackmaxgame.win", custom_domain = true },
  { pattern = "owner.twostackmaxgame.win", custom_domain = true },
]

[build]
command = "worker-build --release"

# ---------------------------------------------------------------------------
# D1 — all POS data (schema v1, see migrations/)
# Remote DB created 2026-10-29 (APAC). Local dev uses .wrangler/state.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "rice-pos"
database_id = "eb902c69-455f-4c6d-bfdf-3eb8ef48618d"
migrations_dir = "migrations"

# R2 — menu images (WebP) now; daily backups/archives later (M5)
# App-enforced free-tier quotas: see api/src/media.rs (R2 has no spending cap).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rice-pos-media"

# Workers AI — the CLOUD slip reader (fallback when the owner's PC agent is
# offline). The app caps itself below the free tier's 10,000 neurons/day: see
# api/src/slips/mod.rs (ai_usage bookkeeping, migration 0009).
[ai]
binding = "AI"

# Cloudflare Access (owner auth) — filled in a later ticket (M0).
# ACCESS_TEAM_DOMAIN: Zero Trust team domain (JWKS + iss), e.g. "<team>.cloudflareaccess.com"
# ACCESS_AUD:         Access application AUD claim
[vars]
ACCESS_TEAM_DOMAIN = "vbo.cloudflareaccess.com"
ACCESS_AUD = "85f5affb5b3c7bb44173c89f678199e7f5c24b935a34fd91b18d085172b69932"
# CORS for the Capacitor Android staff POS APK (bundled SPA, WebView origin
# https://localhost). Comma-separated EXACT origins. /api/owner/* (Access
# cookies) and /api/beam/webhook are never CORS-enabled (api/src/cors.rs).
CORS_ALLOWED_ORIGINS = "https://localhost"

# Slip queue sweep: return expired local-reader leases to the queue and pick
# queued slips up for the cloud reader (api/src/slips/, phase 1).
[triggers]
crons = ["* * * * *"]

# SPA (web/dist) + API in one Worker. Only /api/* runs the Worker first; every
# other path is a static asset, unknown paths fall back to index.html.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------------
# dev environment — `wrangler deploy --env dev` (CI does this on every push to
# main; production is deployed only from a v* tag, see .github/workflows).
#
# Wrangler does NOT inherit bindings or vars into an environment, so everything
# the Worker needs is declared again here. Dev has its own D1 and R2 and none of
# production's data.
#
# One hostname only: the web app serves owner mode at /owner when the host does
# not start with "owner." (see web/src/main.tsx), so no second host is needed.
# No AI binding and no cron in dev — both would spend the account-wide free
# quota that production relies on (the cloud slip reader simply stays off).
# ---------------------------------------------------------------------------
[env.dev]
name = "rice-pos-api-dev"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "pos-dev.twostackmaxgame.win", custom_domain = true },
]

[env.dev.build]
command = "worker-build --release"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "rice-pos-dev"
database_id = "5cbfdf39-503a-4c7b-8d53-fa6cf58bd709"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "MEDIA"
bucket_name = "rice-pos-media-dev"

# Owner auth in dev: create a Cloudflare Access application covering
# pos-dev.twostackmaxgame.win/owner* and /api/owner*, then put its AUD below.
# The AUD below belongs to that dev Access app. Never set
# DEV_OWNER_EMAIL on this public hostname (it would bypass Access).
[env.dev.vars]
ACCESS_TEAM_DOMAIN = "vbo.cloudflareaccess.com"
ACCESS_AUD = "25b2242cbaa1a03c4902b6d6b333952b512fa649631a964a75b2a1b3fbf98ef5"
# Fake Beam (api/src/beam.rs): dev has no Beam account. Never set this in
# production — the code refuses to run if a real BEAM_API_KEY is also present.
BEAM_MOCK = "1"
# CORS for the Capacitor Android staff POS (dev APK): the WebView's origin is
# https://localhost. Comma-separated EXACT origins; /api/owner/* (Access
# cookies) and /api/beam/webhook are never CORS-enabled (api/src/cors.rs).
CORS_ALLOWED_ORIGINS = "https://localhost"

[env.dev.triggers]
crons = []

[env.dev.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
