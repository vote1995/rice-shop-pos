# Deploy to PRODUCTION: runs ONLY when a release tag is pushed (v1.2.3).
# Pushing to main deploys to the dev environment instead (deploy-dev.yml) and
# opening a PR never deploys (ci.yml). No --env flag here = the top-level
# (production) Worker/D1/R2 in api/wrangler.toml.
#
# Release:  git tag v1.2.3 && git push origin v1.2.3
#
# Guards: (1) full CI re-runs on the tagged commit, (2) the tagged commit must
# be reachable from main, (3) the job uses the `production` GitHub environment
# (add required reviewers there for a manual approval step), (4) secrets are
# only exposed to the deploy job, never to PRs/forks.
#
# Required repo (or `production` environment) secrets: CLOUDFLARE_API_TOKEN
# (Workers Scripts:Edit, D1:Edit, Workers Routes:Edit, Zone:Read for the zone
# used in api/wrangler.toml), CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to deploy."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
          cache-bin: true
      - name: install worker-build
        run: command -v worker-build || cargo install worker-build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web (served as Worker static assets)
        working-directory: web
        run: npm ci && npm run build
      - name: migrate D1 (remote)
        working-directory: api
        run: npx --yes wrangler@4 d1 migrations apply rice-pos --remote
      - name: deploy Worker
        working-directory: api
        run: npx --yes wrangler@4 deploy
